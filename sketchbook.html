<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>무제 캔버스</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="site-nav" aria-label="페이지 이동">
  <a href="index.html">로비</a>
  <a href="sketchbook.html" class="active">스케치북</a>
  <a href="library.html">기록 보관소</a>
</nav>

<div id="stage">
  <div id="pageWrap">
    <canvas id="canvas" aria-label="스케치북 페이지"></canvas>
  </div>
</div>

<div id="pager" role="group" aria-label="페이지 넘기기">
  <button class="nav-btn" id="prevBtn" title="이전 페이지">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6" /></svg>
  </button>
  <span id="pageLabel">1 / 1</span>
  <input id="pageJump" type="number" min="1" step="1" />
  <button class="nav-btn" id="nextBtn" title="다음 페이지">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6" /></svg>
  </button>
  <span class="pager-divider"></span>
  <button class="nav-btn" id="deletePageBtn" title="이 페이지 삭제">
    <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M6 4v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V8l-5-5H7a1 1 0 0 0-1 1Z" />
      <path d="M13 3v4a1 1 0 0 0 1 1h4" />
      <path d="M9.5 13.5l5 5M14.5 13.5l-5 5" />
    </svg>
  </button>
</div>

<div id="dock">
  <div id="panel" role="group" aria-label="그리기 도구">
    <div class="row swatches" id="swatches"></div>
    <div class="row">
      <div class="sizes" id="sizes"></div>
      <input type="color" id="customColor" title="다른 색" value="#2b2b2e" />
    </div>
    <div class="divider"></div>
    <div class="row">
      <button class="icon-btn" id="eraserBtn" title="지우개">
        <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13 9 22H4l-1.5-1.5a2 2 0 0 1 0-2.8L14 6.2a2 2 0 0 1 2.8 0l3.5 3.5a2 2 0 0 1 0 2.8L18 15" />
          <path d="M14 6.2 6.5 13.7" />
        </svg>
      </button>
      <button class="icon-btn" id="undoBtn" title="내 마지막 획 취소">
        <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 14 4 9l5-5" />
          <path d="M4 9h10a6 6 0 0 1 0 12h-3" />
        </svg>
      </button>
      <button class="icon-btn" id="openImgBtn" title="이미지로 열기">
        <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <circle cx="8.5" cy="9.5" r="1.4" />
          <path d="m4 17 5-5 4 4 3-3 4 4" />
        </svg>
      </button>
      <button class="icon-btn danger" id="clearBtn" title="이 페이지 전부 지우기">
        <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16" />
          <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
          <path d="m6 7 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" />
        </svg>
      </button>
    </div>
  </div>
  <button id="handle" title="도구 열기/닫기" aria-expanded="false" aria-controls="panel">
    <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="m14.5 3.5 6 6L8 22H2v-6Z" />
    </svg>
  </button>
</div>

<div id="toast"></div>

<script type="module" src="js/sketchbook/main.js"></script>
</body>
</html>
