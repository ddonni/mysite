<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기록 보관소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/library.css?v=11">
<link rel="stylesheet" href="css/nav.css?v=3">
<link rel="stylesheet" href="css/feedback.css">
<link rel="stylesheet" href="css/inapp.css">
</head>
<body>

<nav class="site-nav" aria-label="페이지 이동">
  <a href="./" data-page="./">방</a>
  <a href="sketchbook" data-page="sketchbook">캔버스</a>
  <a href="library" data-page="library" class="active">기록 보관소</a>
  <a href="rooms">둘러보기</a>
  <button type="button" class="nav-feedback" data-feedback-open>의견 보내기</button>
</nav>

<main class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Archive</div>
      <h1>기록 보관소</h1>
      <div class="meta"><span id="totalCount">0</span>개</div>
    </div>
    <button type="button" class="add-btn" id="addTabBtn">+ 기록하기</button>
  </header>

  <div class="tabs" id="tabs" role="group" aria-label="카테고리"></div>

  <section class="featured" id="featured" hidden>
    <h2 class="section-title" id="featuredTitle">인생작</h2>
    <div class="cards featured-cards" id="featuredGrid"></div>
  </section>

  <h2 class="section-title" id="allTitle" hidden></h2>
  <div class="cards" id="list"><div class="empty">불러오는 중…</div></div>
</main>

<div class="detail-dialog" id="detailDialog" role="dialog" aria-modal="true" hidden>
  <div class="detail-card"></div>
</div>

<!-- Add/Edit Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">새 기록</h2>

    <div class="cat-tabs" id="catTabs"></div>

    <!-- 제목·만든 사람을 한 묶음으로 두고, 두 칸의 추천 목록은 묶음 아래(가수 칸
         밑)에 펼침 — 제목 칸 목록이 바로 밑의 가수 칸을 덮어서 가수를 고쳐 쓰기
         어려웠음. -->
    <div class="title-group">
      <div class="field title-field">
        <label for="fTitle">제목</label>
        <input type="text" id="fTitle" autocomplete="off" placeholder="제목을 입력해 보세요">
      </div>
      <div class="field creator-field">
        <label for="fCreator" id="creatorLabel">작가</label>
        <input type="text" id="fCreator" autocomplete="off">
      </div>
      <div class="preset-list" id="presetList" style="display:none;"></div>
      <div class="preset-list" id="creatorList" style="display:none;"></div>
    </div>
    <div id="titleError" class="field-error title-error" style="display:none;">제목을 적어 주세요.</div>

    <div class="field">
      <label>별점</label>
      <div class="stars" id="starPicker"></div>
    </div>

    <div class="field">
      <label>사진 (선택)</label>
      <div class="photo-drop" id="photoDrop">
        <span id="photoDropText">드래그하거나 클릭해서 선택</span>
        <input type="file" id="fPhoto" accept="image/*">
      </div>
      <img id="photoPreview">
      <span class="remove-photo" id="removePhoto">사진 지우기</span>
    </div>

    <div class="field">
      <label>한 줄 감상</label>
      <textarea id="fMemo" placeholder="어땠는지 한 줄로 남겨보세요"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">취소</button>
      <button class="btn primary" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<script type="module" src="js/shared/inAppBrowser.js"></script>
<script type="module" src="js/library/main.js"></script>
<script type="module" src="js/shared/feedback.js"></script>
</body>
</html>
