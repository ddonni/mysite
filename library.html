<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기록 보관소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/library.css">
</head>
<body>

<div class="wrap">
  <div class="top">
    <h1>기록 보관소</h1>
    <div class="top-right">
      <div class="meta"><span id="totalCount">0</span>건</div>
      <button class="add-link" id="addTabBtn">+ 기록</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"></div>
</div>

<!-- Add/Edit Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">새로운 기록</h2>

    <div class="cat-tabs" id="catTabs"></div>

    <div class="field">
      <label>제목</label>
      <div class="title-wrap">
        <input type="text" id="fTitle" placeholder="제목을 입력하거나 목록에서 골라보세요">
        <div class="preset-list" id="presetList" style="display:none;"></div>
      </div>
      <div id="titleError" style="display:none; color:var(--accent); font-size:11.5px; margin-top:5px;">제목을 입력하거나 목록에서 골라주세요.</div>
    </div>

    <div class="field">
      <label>작가 / 감독 / 제작</label>
      <input type="text" id="fCreator" placeholder="예: 미야자키 하야오">
    </div>

    <div class="field">
      <label>별점</label>
      <div class="stars" id="starPicker"></div>
    </div>

    <div class="field">
      <label>사진 (선택)</label>
      <div class="photo-drop" id="photoDrop">
        <span id="photoDropText">드래그하거나 클릭해서 선택</span>
        <input type="file" id="fPhoto" accept="image/*">
      </div>
      <img id="photoPreview">
      <span class="remove-photo" id="removePhoto">사진 지우기</span>
    </div>

    <div class="field">
      <label>한 줄 감상</label>
      <textarea id="fMemo" placeholder="남기고 싶은 말"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">취소</button>
      <button class="btn primary" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<script src="js/library.js"></script>
</body>
</html>
