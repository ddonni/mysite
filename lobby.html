<!DOCTYPE html>
<html lang="ko" class="lobby-page">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 방</title>
<!-- 카카오톡·인스타 링크 미리보기. 크롤러는 JS를 안 돌려서 방마다 다르게는 못 하고 공통 카드 하나 -->
<meta name="description" content="읽고, 보고, 들은 것들이 끝없는 서가에 꽂히는 기억 보관소">
<meta property="og:type" content="website">
<meta property="og:site_name" content="내 방">
<meta property="og:title" content="기억 보관소 — 내 기록">
<meta property="og:description" content="읽고, 보고, 들은 것들이 끝없는 서가에 꽂히는 기억 보관소">
<meta property="og:image" content="https://ddonni.github.io/mysite/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/lobby.css?v=9">
<link rel="stylesheet" href="css/nav.css?v=8">
<link rel="stylesheet" href="css/feedback.css?v=2">
<link rel="stylesheet" href="css/inapp.css">
<link rel="stylesheet" href="css/visibility.css">
<link rel="stylesheet" href="css/player.css">
</head>
<body>

<nav class="site-nav" aria-label="페이지 이동">
  <!-- 위 줄: 어디서든 바로 가는 곳. 방 코드·둘러보기·의견 보내기 등은 ☰ 서랍(js/shared/roomNav.js) -->
  <button type="button" class="nav-menu" aria-label="메뉴 열기" aria-expanded="false" aria-controls="navDrawer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <!-- 3D 도서관(예전 3D 방). 위 줄은 첫 화면("내 방")과 같게(2026-11-27 사용자 요청): 내 방 · 티어리스트 · 3D 도서관 ·
       방 기록 편집하기(첫 화면의 편집 — ?cat=all) · +(새 기록 창 — ?new=1). 남의 방이면 편집하기·+ 없음(js/lobby/roomChrome.js). "내 방"은 홈 버튼 — 늘 내 방으로 -->
  <a href="./" class="home-link">내 방</a>
  <a href="tier" data-page="tier">티어리스트</a>
  <a href="lobby" data-page="lobby" class="active" aria-current="page">3D 도서관</a>
  <a href="./?cat=all" data-page="./?cat=all" class="owner-only">방 기록 편집하기</a>
  <a href="./?new=1" data-page="./?new=1" class="owner-only nav-add" aria-label="기록 추가" title="기록 추가">+</a>
</nav>

<div id="stage">
  <canvas id="canvas3d"></canvas>
  <div id="loading">기억을 불러오는 중…</div>
</div>

<div id="ui">
  <div id="header">
    <div class="eyebrow">Memory Archive</div>
    <h1>기억 보관소</h1>
    <div class="room-name" id="roomName"></div>
    <p>읽고, 보고, 들은 것들이 끝없는 서가에 한 권씩 꽂혀요.</p>
    <div class="orb-count" id="orbCount" hidden></div>
    <!-- 폰에서만 보임: 공개 스위치·구글 버튼을 접어 두고 이걸로 펼침(roomChrome.js) -->
    <button type="button" class="header-more" id="headerMore" aria-expanded="false" hidden>방 설정</button>
    <!-- 남의 방을 구경하는 사람에게만 보임(roomChrome.js) -->
    <a class="my-room-cta" id="myRoomCta" hidden></a>
    <div class="header-controls">
      <div class="vis-box" id="visibilityBox"></div>
    </div>
    <div class="google-btn"></div>
  </div>

  <div class="lobby-foot">
    <a id="devRoomLink" class="dev-room-link" hidden>개발자의 방 구경하기 →</a>
    <div id="googleUnlink" class="google-unlink-slot"></div>
  </div>

  <!-- 내 기록이 하나도 없는 동안만(onboarding.js) -->
  <a id="ctaHint" class="cta-hint" hidden href="./?cat=book&amp;new=1">첫 기록을 남기면 서가에 첫 권이 꽂혀요</a>
  <!-- 아래 버튼: 처음 시점 + 카테고리만 밝히기(나머지는 어둡게) + 캔버스(이젤로) — js/lobby/main.js -->
  <div id="cta" role="group" aria-label="보기">
    <!-- 전체 보기(위에서 내려다보기) ↔ 가까이 보기(최근 기록 탑) — js/lobby/main.js -->
    <button class="room-btn view-btn" id="viewHome"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5z"/><path d="m3 13 9 5 9-5"/></svg><span>전체 보기</span></button>
    <button class="room-btn" data-filter="" aria-pressed="true"><span class="dot all"></span>전체</button>
    <button class="room-btn" data-filter="book" data-room="book" aria-pressed="false"><span class="dot"></span>책</button>
    <button class="room-btn" data-filter="anime" data-room="anime" aria-pressed="false"><span class="dot"></span>애니</button>
    <button class="room-btn" data-filter="movie" data-room="movie" aria-pressed="false"><span class="dot"></span>영화·시리즈</button>
    <button class="room-btn" data-filter="music" data-room="music" aria-pressed="false"><span class="dot"></span>음악</button>
    <button class="room-btn canvas-go" data-room="sketchbook" aria-pressed="false"><span class="dot"></span>캔버스</button>
  </div>

  <!-- 이젤을 누르면: 캔버스로 들어갈지 -->
  <div id="card" data-room="sketchbook">
    <div class="room-tag" id="cardTag">Canvas</div>
    <h2 id="cardTitle">캔버스</h2>
    <p id="cardBody">마음 가는 대로 그려보세요. 캔버스는 이 보관소의 이젤에서만 열려요.</p>
    <div class="card-actions">
      <button id="cardBack">돌아가기</button>
      <button id="cardEnter">입장하기</button>
    </div>
  </div>

  <!-- 서가의 기록을 누르면: 그 기록(책·포스터는 눈앞으로 날아옴 — archive/heldCover.js) -->
  <aside id="memory" class="memory" hidden aria-live="polite">
    <button type="button" class="memory-close" id="memClose" aria-label="닫기">×</button>
    <div class="memory-tag" id="memTag"></div>
    <h2 id="memTitle"></h2>
    <div class="memory-sub" id="memSub"></div>
    <div class="memory-meta" id="memMeta"></div>
    <p class="memory-memo" id="memMemo"></p>
    <div class="memory-actions">
      <button type="button" id="memListen" class="memory-listen" hidden>▶ 듣기</button>
      <a id="memOpen" class="memory-cardlink">카드로 보기</a>
    </div>
    <!-- 옆 기록으로 — 그 사람 서가 안에서만(js/lobby/main.js의 stepMemory, 키보드 ←/→도) -->
    <div class="memory-steps">
      <button type="button" id="memPrev" class="memory-step" aria-label="이전 기록" title="이전 기록">‹</button>
      <button type="button" id="memNext" class="memory-step" aria-label="다음 기록" title="다음 기록">›</button>
    </div>
  </aside>
  <!-- 마우스를 올린 기록의 제목 -->
  <div id="orbTip" class="orb-tip" hidden></div>
</div>

<div id="fallbackLinks">
  <p id="fallbackMessage">이 브라우저에서는 3D 방을 표시할 수 없어요. 바로 이동해 주세요.</p>
  <a href="./" data-page="./">카드로 보기</a>
  <a href="sketchbook" data-page="sketchbook">캔버스</a>
  <a href="./?cat=book" data-page="./?cat=book">책</a>
  <a href="./?cat=anime" data-page="./?cat=anime">애니</a>
  <a href="./?cat=movie" data-page="./?cat=movie">영화·시리즈</a>
  <a href="./?cat=music" data-page="./?cat=music">음악</a>
  <a href="rooms" data-page="rooms">방 둘러보기</a>
  <div class="room-info"></div>
  <div class="google-btn"></div>
</div>

<!-- 3D 화면(#ui) 바깥에 둬서, 3D를 못 쓰는 폴백 화면에서도 똑같이 뜸 -->
<button type="button" id="helpBtn" class="help-btn" aria-label="도움말 보기" title="도움말">?</button>
<div id="helpDialog" class="help-dialog" role="dialog" aria-modal="true" aria-labelledby="helpTitle" hidden>
  <div class="help-card">
    <div id="helpBody"></div>
    <button type="button" id="helpClose" class="help-close">시작하기</button>
    <p class="help-foot" id="helpFoot">자세한 사용법은 오른쪽 위 <b>?</b> 버튼에 있어요.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>
<script type="module" src="js/shared/inAppBrowser.js"></script>
<script type="module" src="js/lobby/main.js"></script>
<script type="module" src="js/shared/feedback.js"></script>
</body>
</html>
