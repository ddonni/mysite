<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 기록</title>
<!-- 카카오톡·인스타 링크 미리보기. 크롤러는 JS를 안 돌려서 방마다 다르게는 못 하고 공통 카드 하나 -->
<meta name="description" content="읽고, 보고, 들은 책·애니·영화·음악을 기록으로 모아두는 곳">
<meta property="og:type" content="website">
<meta property="og:site_name" content="내 기록">
<meta property="og:title" content="내 기록">
<meta property="og:description" content="읽고, 보고, 들은 책·애니·영화·음악을 기록으로 모아두는 곳">
<meta property="og:image" content="https://ddonni.github.io/mysite/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbit&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/library.css?v=27">
<link rel="stylesheet" href="css/player.css">
<link rel="stylesheet" href="css/nav.css?v=8">
<link rel="stylesheet" href="css/feedback.css?v=2">
<link rel="stylesheet" href="css/inapp.css">
<link rel="stylesheet" href="css/visibility.css">
<!-- 카드 시안(흰 바탕·Orbit·각진 카드) — library.css 위에 덮어씀. library.css는 둘러보기도 같이 써서 그대로 둠 -->
<link rel="stylesheet" href="css/cards.css?v=15">
</head>
<body class="cards">

<!-- 위 줄 하나: ☰(방 코드·방 설정·둘러보기·의견 보내기 서랍 — js/shared/roomNav.js) · 누구의 방인지 ·
     카테고리 칩(js/library/list.js) · + 기록. 다른 페이지의 떠 있는 메뉴(전체·책·애니…)는
     이 칩과 겹쳐서 여기선 안 둠. -->
<!-- 윗줄: 프로필(사진 · 이름 · 한 줄 소개 · 내 기록이면 공개 스위치) — 누르면 그 자리에서 고침
     (js/library/profileHeader.js). 스크롤하면 같이 올라가고, 아래 메뉴 줄만 위에 붙어 있음. -->
<header class="profile-head" id="profileHead">
  <button type="button" class="avatar-btn" id="avatarBtn">
    <span class="avatar xl" id="profileAvatar"></span>
    <!-- 내 기록일 때만(마우스를 올리면) — 눌러서 사진을 바꿀 수 있다는 표시 -->
    <span class="avatar-edit" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
  </button>
  <div class="profile-main">
    <h1 class="profile-name" id="profileName">내 기록</h1>
    <p class="profile-bio" id="profileBio"></p>
  </div>
  <div class="profile-vis vis-box" id="profileVis" hidden></div>
</header>
<nav class="site-nav lib-bar" aria-label="페이지 이동">
  <button type="button" class="nav-menu" aria-label="메뉴 열기" aria-expanded="false" aria-controls="navDrawer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="chips" id="tabs" role="group" aria-label="카테고리"></div>
  <!-- 티어리스트로 가는 버튼(tier.html — 보던 칩의 카테고리로 엶, js/library/main.js) -->
  <button type="button" class="tier-btn" id="tierBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="4" height="4" rx="1" fill="#E0485E"/><rect x="3" y="10" width="4" height="4" rx="1" fill="#F2C14E"/><rect x="3" y="16" width="4" height="4" rx="1" fill="#4AA3DF"/><path d="M10 6h11M10 12h8M10 18h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>티어리스트</button>
  <!-- 예전 3D 방(lobby.html — 3d-room 브랜치에서 되살림)으로 전환. data-page라 남의 기록이면 그 방으로 -->
  <a class="room3d-btn" href="lobby" data-page="lobby"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5 12 4l9 5.5v9L12 23l-9-4.5z" fill="#F3E7D3" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 9.5 12 15l9-5.5M12 15v8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>3D 방</a>
  <!-- 보기 방식 — 카드 · 촘촘히(표지만) · 목록(js/library/list/compactViews.js). 피드백 "한눈에 보고 싶다" -->
  <div class="view-switch" id="viewSwitch" role="group" aria-label="보기 방식">
    <button type="button" data-view="cards" aria-pressed="true" aria-label="카드로 보기" title="카드"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="10" rx="1"/><rect x="13" y="3" width="8" height="10" rx="1"/><path d="M3 17h8M13 17h8M3 20h6M13 20h6"/></svg></button>
    <button type="button" data-view="dense" aria-pressed="false" aria-label="촘촘히 보기" title="촘촘히"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="5" height="5"/><rect x="9.5" y="3" width="5" height="5"/><rect x="16" y="3" width="5" height="5"/><rect x="3" y="9.5" width="5" height="5"/><rect x="9.5" y="9.5" width="5" height="5"/><rect x="16" y="9.5" width="5" height="5"/><rect x="3" y="16" width="5" height="5"/><rect x="9.5" y="16" width="5" height="5"/><rect x="16" y="16" width="5" height="5"/></svg></button>
    <button type="button" data-view="list" aria-pressed="false" aria-label="목록으로 보기" title="목록"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="4" height="4"/><rect x="3" y="10" width="4" height="4"/><rect x="3" y="16" width="4" height="4"/><path d="M10 6h11M10 12h11M10 18h11"/></svg></button>
  </div>
  <!-- 남의 방을 구경하는 중에만: 내 방으로 가는 길(js/library/main.js) -->
  <a class="add my-room" id="myRoomCta" hidden></a>
  <button type="button" class="add" id="addTabBtn">+ 기록</button>
</nav>

<main class="wrap">

  <!-- 카드 격자 — 인생작(황금 카드)이 앞에, 나머지가 최신순으로(js/library/list/cardsView.js) -->
  <div class="grid" id="list"><div class="empty">불러오는 중…</div></div>
</main>

<!-- 카드를 나눠줄 때만 잠깐 보이는 덱(화면 아래 가운데) -->
<div class="deck" aria-hidden="true"></div>

<!-- 촘촘히·목록 보기에서 누른 작품의 카드를 크게(뒷면부터) — js/library/list/compactViews.js -->
<div class="card-dialog" id="cardDialog" role="dialog" aria-modal="true" aria-label="기록 카드" hidden>
  <button type="button" class="card-dialog-close" aria-label="닫기">×</button>
  <div class="card-dialog-slot"></div>
</div>

<!-- 프로필 사진 크게 보기 — 내 기록이면 연필(바꾸기)·휴지통(기본 사진으로)(js/library/profileHeader.js) -->
<div class="avatar-dialog" id="avatarDialog" role="dialog" aria-modal="true" aria-label="프로필 사진" hidden>
  <div class="avatar-dialog-card">
    <button type="button" class="avatar-close" aria-label="닫기">×</button>
    <span class="avatar huge" id="avatarBig"></span>
    <div class="avatar-actions" id="avatarActions"></div>
    <p class="avatar-status" id="avatarStatus" aria-live="polite"></p>
    <input type="file" id="avatarFile" accept="image/*" hidden>
  </div>
</div>

<!-- 오른쪽 아래 떠 있는 좋아요 · 방명록(js/library/social.js) -->
<div class="social" id="social" hidden>
  <div class="social-toast" id="socialToast" role="status" aria-live="polite" hidden></div>
  <section class="guestbook" id="guestbook" aria-label="방명록" hidden>
    <header class="gb-head">
      <span class="gb-title">방명록<span id="gbTotal"></span></span>
      <button type="button" class="gb-close" aria-label="방명록 닫기">×</button>
    </header>
    <ul class="gb-list" id="gbList"></ul>
    <form class="gb-form" id="gbForm" hidden>
      <textarea id="gbInput" rows="2" maxlength="300" placeholder="방명록을 남겨 주세요 (Enter로 보내기)" aria-label="방명록 글"></textarea>
      <div class="gb-form-row">
        <label class="gb-anon"><input type="checkbox" id="gbAnon"><span class="gb-switch" aria-hidden="true"></span>익명으로</label>
        <button type="submit" class="gb-send" id="gbSend">남기기</button>
      </div>
    </form>
    <div class="gb-login" id="gbLogin" hidden>
      <span>구글 계정을 연동하면 방명록을 남길 수 있어요.</span>
      <button type="button" class="text-btn">연동하기</button>
    </div>
  </section>
  <div class="social-btns">
    <button type="button" class="fab like" id="likeBtn" aria-pressed="false"><span class="ico"></span><span class="fab-n" id="likeCount">0</span></button>
    <button type="button" class="fab gb" id="guestbookBtn" aria-expanded="false" aria-controls="guestbook" aria-label="방명록 보기" data-tip="방명록"><span class="ico"></span><span class="fab-badge" id="guestbookCount" hidden>0</span></button>
  </div>
</div>

<!-- 구글 로그인이 필요할 때(좋아요·방명록) -->
<div class="login-dialog" id="loginDialog" role="dialog" aria-modal="true" aria-labelledby="loginTitle" hidden>
  <div class="login-card">
    <button type="button" class="login-close" aria-label="닫기">×</button>
    <h2 id="loginTitle">구글 로그인이 필요해요</h2>
    <p id="loginWhy"></p>
    <p class="login-note">내 기록에 구글 계정을 연동하면 돼요. 다른 기기에서도 같은 계정으로 내 기록을 불러올 수 있어요.</p>
    <div class="login-google" id="loginGoogle"></div>
  </div>
</div>

<!-- 처음 온 사람 환영 카드(js/library/welcome.js) -->
<div id="helpDialog" class="help-dialog" role="dialog" aria-modal="true" aria-labelledby="helpTitle" hidden>
  <div class="help-card">
    <div id="helpBody"></div>
    <button type="button" id="helpClose" class="help-close">닫기</button>
  </div>
</div>


<!-- Add/Edit Modal — 새 기록은 검색 화면(js/library/modal/searchView.js)부터, 결과를 고르거나
     직접 쓰기를 누르면 입력 칸. 수정은 입력 칸만(js/library/modal.js) -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">새 기록</h2>

    <div class="cat-tabs" id="catTabs"></div>

    <div id="searchView">
      <div class="s-row">
        <input type="search" id="sQuery" class="s-query" autocomplete="off" enterkeyhint="search" aria-label="검색어">
        <button type="button" class="s-btn" id="sBtn">검색</button>
      </div>
      <div class="s-bar">
        <span id="sStatus" aria-live="polite"></span>
        <button type="button" class="s-manual" id="manualBtn">+ 직접 쓰기</button>
      </div>
      <div class="s-notice" id="sNotice" role="status" hidden></div>
      <ul class="s-results" id="sResults" hidden></ul>
      <p class="s-foot" id="sFoot"></p>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="searchCloseBtn">닫기</button>
      </div>
    </div>

    <div id="formView" hidden>
      <!-- 제목·만든 사람을 한 묶음으로 두고, 두 칸의 추천 목록은 묶음 아래(가수 칸
           밑)에 펼침 — 제목 칸 목록이 바로 밑의 가수 칸을 덮어서 가수를 고쳐 쓰기
           어려웠음. -->
      <div class="title-group">
        <div class="field title-field">
          <label for="fTitle">제목</label>
          <input type="text" id="fTitle" autocomplete="off" placeholder="제목을 입력해 보세요">
        </div>
        <div class="field creator-field">
          <label for="fCreator" id="creatorLabel">작가</label>
          <input type="text" id="fCreator" autocomplete="off">
        </div>
        <div class="ac-list" id="titleList" style="display:none;"></div>
        <div class="ac-list" id="creatorList" style="display:none;"></div>
      </div>
      <div id="titleError" class="field-error title-error" style="display:none;">제목을 적어 주세요.</div>

      <!-- 보는 중·읽는 중(음악은 없음) — 카드 표지에 표시됨(js/library/modal.js) -->
      <div class="field progress-field" id="progressField">
        <label class="progress-toggle"><input type="checkbox" id="fProgress"><span class="switch" aria-hidden="true"></span><span id="progressLabel">아직 보는 중이에요</span></label>
      </div>

      <div class="field">
        <label>별점 (선택)</label>
        <div class="stars" id="starPicker"></div>
      </div>

      <!-- 음악만 — 틀 유튜브 주소. 검색 결과를 고르면 찾아서 채워 둠(js/shared/youtube.js). -->
      <div class="field listen-field" id="listenField" hidden>
        <label for="fListen">유튜브 링크 (선택)</label>
        <div class="listen-row">
          <input type="text" id="fListen" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://youtu.be/…">
          <button type="button" class="listen-try" id="listenTry">▶ 들어보기</button>
        </div>
        <div class="field-hint" id="listenHint"></div>
        <div class="field-error" id="listenError" style="display:none;">유튜브 링크만 넣을 수 있어요.</div>
      </div>

      <div class="field">
        <label>사진 (선택)</label>
        <div class="photo-drop" id="photoDrop">
          <span id="photoDropText">드래그하거나 클릭해서 선택</span>
          <input type="file" id="fPhoto" accept="image/*">
        </div>
        <img id="photoPreview">
        <span class="remove-photo" id="removePhoto">사진 지우기</span>
      </div>

      <div class="field">
        <label>한 줄 감상 (선택)</label>
        <textarea id="fMemo" placeholder="어땠는지 한 줄로 남겨보세요"></textarea>
      </div>

      <!-- 세부 기록(선택) — 감상 아래에 늘 펼쳐져 있음(사용자 요청). 요소별 별점·장르, 음악은 없음
           (js/library/modal/detailFields.js) -->
      <div class="field detail-field" id="detailField">
        <label>자세히 (선택)</label>
        <div class="detail-body" id="detailBody"></div>
      </div>

      <div class="modal-actions">
        <button class="btn ghost" id="cancelBtn">취소</button>
        <button class="btn primary" id="saveBtn">저장</button>
      </div>
    </div>
  </div>
</div>

<!-- 구글 계정 연결 버튼(☰ 서랍의 방 설정 — js/shared/googleAuth.js) -->
<script src="https://accounts.google.com/gsi/client"></script>
<script type="module" src="js/shared/inAppBrowser.js"></script>
<script type="module" src="js/library/main.js"></script>
<script type="module" src="js/shared/feedback.js"></script>
</body>
</html>
