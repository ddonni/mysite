<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 방</title>
<!-- 링크 미리보기(카카오톡·SNS)용. 정적 사이트라 방마다 다르게는 못 하고 공통 문구만. -->
<meta property="og:type" content="website">
<meta property="og:title" content="내 방 — 읽고, 보고, 들은 것들을 모아두는 3D 방">
<meta property="og:description" content="책·애니·영화·음악 기록이 가구가 되는 방. 링크를 눌러 구경해 보세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/lobby.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/feedback.css">
<link rel="stylesheet" href="css/visibility.css">
</head>
<body>

<nav class="site-nav" aria-label="페이지 이동">
  <a href="./" data-page="./" class="active">방</a>
  <a href="sketchbook" data-page="sketchbook">캔버스</a>
  <a href="library" data-page="library">기록 보관소</a>
  <a href="rooms">둘러보기</a>
  <button type="button" class="nav-feedback" data-feedback-open>의견 보내기</button>
</nav>

<div id="stage">
  <canvas id="canvas3d"></canvas>
  <div id="loading">방을 꾸미는 중…</div>
</div>

<div id="ui">
  <div id="header">
    <div class="eyebrow">Archive Room</div>
    <h1>내 방</h1>
    <div class="room-name" id="roomName"></div>
    <p>읽고, 보고, 들은 것들을 모아두는 방이에요.</p>
    <div class="header-controls">
      <div class="theme-picker" id="themePicker"></div>
      <div class="vis-box" id="visibilityBox"></div>
      <button type="button" id="shareBtn" class="share-btn" hidden>공유하기</button>
    </div>
    <div class="google-btn"></div>
  </div>


  <div class="lobby-foot">
    <a id="devRoomLink" class="dev-room-link" hidden>개발자의 방 구경하기 →</a>
    <div id="googleUnlink" class="google-unlink-slot"></div>
  </div>

  <div id="cta">
    <button class="room-btn" data-room="sketchbook" aria-pressed="false"><span class="dot"></span>캔버스</button>
    <button class="room-btn" data-room="book" aria-pressed="false"><span class="dot"></span>책</button>
    <button class="room-btn" data-room="anime" aria-pressed="false"><span class="dot"></span>애니</button>
    <button class="room-btn" data-room="movie" aria-pressed="false"><span class="dot"></span>영화</button>
    <button class="room-btn" data-room="music" aria-pressed="false"><span class="dot"></span>음악</button>
  </div>

  <div id="card" data-room="sketchbook">
    <div class="room-tag" id="cardTag"></div>
    <h2 id="cardTitle">캔버스</h2>
    <p id="cardBody">마음 가는 대로 그려보세요.</p>
    <div class="card-actions">
      <button id="cardBack">돌아가기</button>
      <button id="cardEnter">입장하기</button>
    </div>
  </div>
</div>

<div id="fallbackLinks">
  <p id="fallbackMessage">이 브라우저에서는 3D 방을 표시할 수 없어요. 바로 이동해 주세요.</p>
  <a href="sketchbook">캔버스</a>
  <a href="library?cat=book">책</a>
  <a href="library?cat=anime">애니</a>
  <a href="library?cat=movie">영화</a>
  <a href="library?cat=music">음악</a>
  <a href="rooms">방 둘러보기</a>
  <div class="room-info"></div>
  <div class="google-btn"></div>
</div>

<!-- 3D 화면(#ui) 바깥에 둬서, 3D를 못 쓰는 폴백 화면에서도 똑같이 뜸 -->
<button type="button" id="helpBtn" class="help-btn" aria-label="도움말 보기" title="도움말">?</button>
<div id="helpDialog" class="help-dialog" role="dialog" aria-modal="true" aria-labelledby="helpTitle" hidden>
  <div class="help-card">
    <div id="helpBody"></div>
    <button type="button" id="helpClose" class="help-close">시작하기</button>
    <p class="help-foot">오른쪽 위 <b>?</b> 버튼으로 언제든 다시 볼 수 있어요.</p>
  </div>
</div>

<!-- 공유 창(js/lobby/share.js) — 3D 방을 찍은 사진 + 방 링크 -->
<div id="shareDialog" class="share-dialog" role="dialog" aria-modal="true" aria-labelledby="shareTitle" hidden>
  <div class="share-card">
    <h2 id="shareTitle">방 공유하기</h2>
    <div class="share-frame"><img class="share-preview" alt="지금 보이는 방을 찍은 사진"></div>
    <p class="share-hint"></p>
    <div class="share-actions">
      <button type="button" class="share-main" data-share="instagram">인스타그램에 올리기</button>
      <button type="button" data-share="save">사진 저장</button>
      <button type="button" data-share="copy">링크 복사</button>
    </div>
    <button type="button" class="share-close">닫기</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>
<script type="module" src="js/lobby/main.js"></script>
<script type="module" src="js/shared/feedback.js"></script>
</body>
</html>
